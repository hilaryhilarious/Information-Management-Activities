<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - EvenTrix</title>
    <link href="/assets/css/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .main-content { margin-left: 256px; }
    </style>
</head>
<body class="bg-soft">
    <div id="sidebar-container"></div>
    
    <div class="main-content min-h-screen">
        <div id="navbar-container"></div>
        
        <main class="p-8">
            <div class="mb-8">
                <h2 class="text-3xl font-bold text-primary" data-testid="analytics-title">Analytics & Reports</h2>
                <p class="text-gray-600 mt-2">Performance insights and data analysis</p>
            </div>
            
            <!-- Overview Stats -->
            <div class="grid md:grid-cols-4 gap-6 mb-8">
                <div class="card bg-gradient-to-br from-blue-500 to-blue-700 text-white" data-testid="analytics-total-events">
                    <h3 class="text-sm font-semibold mb-2">Total Events</h3>
                    <p class="text-3xl font-bold" id="analyticsEvents">0</p>
                </div>
                <div class="card bg-gradient-to-br from-green-500 to-green-700 text-white" data-testid="analytics-total-participants">
                    <h3 class="text-sm font-semibold mb-2">Total Participants</h3>
                    <p class="text-3xl font-bold" id="analyticsParticipants">0</p>
                </div>
                <div class="card bg-gradient-to-br from-orange-500 to-orange-700 text-white" data-testid="analytics-total-scores">
                    <h3 class="text-sm font-semibold mb-2">Scores Submitted</h3>
                    <p class="text-3xl font-bold" id="analyticsScores">0</p>
                </div>
                <div class="card bg-gradient-to-br from-purple-500 to-purple-700 text-white" data-testid="analytics-active-judges">
                    <h3 class="text-sm font-semibold mb-2">Active Judges</h3>
                    <p class="text-3xl font-bold" id="analyticsJudges">0</p>
                </div>
            </div>
            
            <!-- Event Analytics -->
            <div class="card mb-8">
                <h3 class="text-2xl font-bold text-primary mb-6" data-testid="event-analytics-heading">Event Analytics</h3>
                <div id="eventAnalytics" data-testid="event-analytics-content">
                    <p class="text-gray-500">Select an event to view detailed analytics</p>
                </div>
            </div>
            
            <!-- Top Performers -->
            <div class="card">
                <h3 class="text-2xl font-bold text-primary mb-6" data-testid="top-performers-heading">Top Performers</h3>
                <div id="topPerformers" data-testid="top-performers-content">
                    <p class="text-gray-500">Performance data will be displayed here</p>
                </div>
            </div>
        </main>
        
        <div id="footer-container"></div>
    </div>
    
    <script src="/assets/js/main.js"></script>
    <script>
        async function loadComponent(elementId, componentPath) {
            const response = await fetch(componentPath);
            const html = await response.text();
            document.getElementById(elementId).innerHTML = html;
        }
        
        async function initAnalytics() {
            const user = await checkAuth();
            if (!user) {
                window.location.href = '/login.html';
                return;
            }
            loadAnalytics();
        }
        
        async function loadAnalytics() {
            try {
                const response = await fetch('/api/get_events.php');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('analyticsEvents').textContent = data.events.length;
                    const totalParticipants = data.events.reduce((sum, e) => sum + parseInt(e.participant_count || 0), 0);
                    document.getElementById('analyticsParticipants').textContent = totalParticipants;
                }
            } catch (error) {
                console.error('Error loading analytics:', error);
            }
        }
        
        loadComponent('sidebar-container', '/components/sidebar.html');
        loadComponent('navbar-container', '/components/navbar.html');
        loadComponent('footer-container', '/components/footer.html');
        initAnalytics();
    </script>
</body>
</html>
