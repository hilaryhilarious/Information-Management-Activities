<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - EvenTrix</title>
    <link href="/assets/css/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .main-content { margin-left: 256px; }
    </style>
</head>
<body class="bg-soft">
    <div id="sidebar-container"></div>
    
    <div class="main-content min-h-screen">
        <div id="navbar-container"></div>
        
        <main class="p-8">
            <div class="mb-8 flex justify-between items-center">
                <div>
                    <h2 class="text-3xl font-bold text-primary" data-testid="events-title">Events Management</h2>
                    <p class="text-gray-600 mt-2">Create and manage competition events</p>
                </div>
                <button onclick="showCreateEventModal()" class="btn-primary" data-testid="create-event-btn">+ Create Event</button>
            </div>
            
            <!-- Filter Tabs -->
            <div class="mb-6 flex space-x-4" data-testid="event-filter-tabs">
                <button onclick="filterEvents('all')" class="px-6 py-2 rounded-lg bg-accent text-white font-semibold" id="filter-all" data-testid="filter-all">All</button>
                <button onclick="filterEvents('upcoming')" class="px-6 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 font-semibold" id="filter-upcoming" data-testid="filter-upcoming">Upcoming</button>
                <button onclick="filterEvents('ongoing')" class="px-6 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 font-semibold" id="filter-ongoing" data-testid="filter-ongoing">Ongoing</button>
                <button onclick="filterEvents('completed')" class="px-6 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 font-semibold" id="filter-completed" data-testid="filter-completed">Completed</button>
            </div>
            
            <!-- Events Grid -->
            <div id="eventsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6" data-testid="events-grid">
                <p class="text-gray-500">Loading events...</p>
            </div>
        </main>
        
        <div id="footer-container"></div>
    </div>
    
    <script src="/assets/js/main.js"></script>
    <script>
        let allEvents = [];
        let currentFilter = 'all';
        
        async function loadComponent(elementId, componentPath) {
            const response = await fetch(componentPath);
            const html = await response.text();
            document.getElementById(elementId).innerHTML = html;
        }
        
        async function initEvents() {
            const user = await checkAuth();
            if (!user) {
                window.location.href = '/login.html';
                return;
            }
            loadEvents();
        }
        
        async function loadEvents() {
            try {
                const response = await fetch('/api/get_events.php');
                const data = await response.json();
                
                if (data.success) {
                    allEvents = data.events;
                    displayEvents(allEvents);
                }
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }
        
        function displayEvents(events) {
            const grid = document.getElementById('eventsGrid');
            if (events.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-12">No events found</p>';
                return;
            }
            
            grid.innerHTML = events.map(event => `
                <div class="card hover:shadow-xl transition-shadow" data-testid="event-card-${event.event_id}">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-xl font-bold text-primary">${event.event_name}</h3>
                        <span class="px-3 py-1 rounded-full text-xs font-semibold ${
                            event.status === 'ongoing' ? 'bg-green-100 text-green-700' : 
                            event.status === 'upcoming' ? 'bg-blue-100 text-blue-700' : 
                            'bg-gray-100 text-gray-700'
                        }">${event.status}</span>
                    </div>
                    <p class="text-gray-600 mb-4 text-sm">${event.description || 'No description'}</p>
                    <div class="space-y-2 text-sm text-gray-500 mb-4">
                        <p><strong>Type:</strong> ${event.event_type || 'N/A'}</p>
                        <p><strong>Start:</strong> ${formatDate(event.start_date)}</p>
                        <p><strong>👥 Participants:</strong> ${event.participant_count}</p>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="viewEvent(${event.event_id})" class="btn-primary text-sm flex-1" data-testid="view-event-${event.event_id}">View</button>
                        <button onclick="editEvent(${event.event_id})" class="btn-secondary text-sm flex-1" data-testid="edit-event-${event.event_id}">Edit</button>
                    </div>
                </div>
            `).join('');
        }
        
        function filterEvents(status) {
            currentFilter = status;
            ['all', 'upcoming', 'ongoing', 'completed'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === status) {
                    btn.className = 'px-6 py-2 rounded-lg bg-accent text-white font-semibold';
                } else {
                    btn.className = 'px-6 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 font-semibold';
                }
            });
            
            const filtered = status === 'all' ? allEvents : allEvents.filter(e => e.status === status);
            displayEvents(filtered);
        }
        
        function viewEvent(eventId) {
            window.location.href = `/pages/rankings.html?event_id=${eventId}`;
        }
        
        function editEvent(eventId) {
            showNotification('Edit functionality coming soon', 'info');
        }
        
        function showCreateEventModal() {
            showNotification('Create event functionality coming soon', 'info');
        }
        
        loadComponent('sidebar-container', '/components/sidebar.html');
        loadComponent('navbar-container', '/components/navbar.html');
        loadComponent('footer-container', '/components/footer.html');
        initEvents();
    </script>
</body>
</html>
