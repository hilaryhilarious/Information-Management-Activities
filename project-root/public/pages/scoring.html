<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoring - EvenTrix</title>
    <link href="/assets/css/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .main-content { margin-left: 256px; }
    </style>
</head>
<body class="bg-soft">
    <div id="sidebar-container"></div>
    
    <div class="main-content min-h-screen">
        <div id="navbar-container"></div>
        
        <main class="p-8">
            <div class="mb-8">
                <h2 class="text-3xl font-bold text-primary" data-testid="scoring-title">Scoring Interface</h2>
                <p class="text-gray-600 mt-2">Submit scores for assigned events</p>
            </div>
            
            <!-- Event Selection -->
            <div class="card mb-8">
                <label class="block text-gray-700 font-semibold mb-2">Select Event to Score</label>
                <select id="eventSelector" class="input-field" data-testid="scoring-event-selector">
                    <option value="">Loading your assigned events...</option>
                </select>
            </div>
            
            <!-- Scoring Form -->
            <div id="scoringFormContainer" class="hidden" data-testid="scoring-form-container">
                <div class="grid md:grid-cols-2 gap-6 mb-6">
                    <!-- Participant Selection -->
                    <div class="card">
                        <h3 class="text-xl font-bold text-primary mb-4" data-testid="participant-selection-heading">Select Participant/Team</h3>
                        <select id="participantSelector" class="input-field" data-testid="participant-selector">
                            <option value="">Choose participant/team</option>
                        </select>
                    </div>
                    
                    <!-- Criteria Selection -->
                    <div class="card">
                        <h3 class="text-xl font-bold text-primary mb-4" data-testid="criteria-selection-heading">Select Criteria</h3>
                        <select id="criteriaSelector" class="input-field" data-testid="criteria-selector">
                            <option value="">Choose scoring criteria</option>
                        </select>
                        <div id="criteriaInfo" class="mt-3 text-sm text-gray-600" data-testid="criteria-info"></div>
                    </div>
                </div>
                
                <!-- Score Input -->
                <div class="card">
                    <h3 class="text-xl font-bold text-primary mb-4" data-testid="score-input-heading">Submit Score</h3>
                    <form id="scoreForm" data-testid="score-form">
                        <div class="grid md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label class="block text-gray-700 font-semibold mb-2">Score Value</label>
                                <input type="number" id="scoreValue" step="0.01" min="0" class="input-field" placeholder="Enter score" required data-testid="score-value-input">
                                <p class="text-sm text-gray-500 mt-1" id="scoreHint" data-testid="score-hint">Maximum score will be shown here</p>
                            </div>
                            <div>
                                <label class="block text-gray-700 font-semibold mb-2">Remarks (Optional)</label>
                                <textarea id="scoreRemarks" class="input-field" rows="3" placeholder="Add any remarks" data-testid="score-remarks-textarea"></textarea>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary w-full md:w-auto" data-testid="submit-score-btn">Submit Score</button>
                    </form>
                </div>
            </div>
        </main>
        
        <div id="footer-container"></div>
    </div>
    
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/scoring.js"></script>
    <script>
        let currentEvent = null;
        let currentCriteria = [];
        let currentParticipants = [];
        
        async function loadComponent(elementId, componentPath) {
            const response = await fetch(componentPath);
            const html = await response.text();
            document.getElementById(elementId).innerHTML = html;
        }
        
        async function initScoring() {
            const user = await checkAuth();
            if (!user) {
                window.location.href = '/login.html';
                return;
            }
            
            // For now, load all events (should filter by judge assignment)
            loadEvents();
        }
        
        async function loadEvents() {
            try {
                const response = await fetch('/api/get_events.php?status=ongoing');
                const data = await response.json();
                
                if (data.success) {
                    const select = document.getElementById('eventSelector');
                    if (data.events.length === 0) {
                        select.innerHTML = '<option value="">No ongoing events assigned to you</option>';
                    } else {
                        select.innerHTML = '<option value="">Select an event</option>' + 
                            data.events.map(e => `<option value="${e.event_id}">${e.event_name}</option>`).join('');
                    }
                }
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }
        
        document.getElementById('eventSelector').addEventListener('change', async (e) => {
            const eventId = e.target.value;
            if (eventId) {
                currentEvent = eventId;
                await loadEventData(eventId);
                document.getElementById('scoringFormContainer').classList.remove('hidden');
            } else {
                document.getElementById('scoringFormContainer').classList.add('hidden');
            }
        });
        
        async function loadEventData(eventId) {
            try {
                // Load participants
                const partResponse = await fetch(`/api/get_event_participants.php?event_id=${eventId}`);
                const partData = await partResponse.json();
                
                if (partData.success) {
                    currentParticipants = partData.participants;
                    const select = document.getElementById('participantSelector');
                    select.innerHTML = '<option value="">Choose participant/team</option>' + 
                        partData.participants.map(p => {
                            const name = p.team_name || `${p.first_name} ${p.last_name}`;
                            const type = p.team_id ? 'team' : 'participant';
                            const id = p.team_id || p.participant_id;
                            return `<option value="${type}:${id}">${name}</option>`;
                        }).join('');
                }
                
                // Load criteria
                const critResponse = await fetch(`/api/get_criteria.php?event_id=${eventId}`);
                const critData = await critResponse.json();
                
                if (critData.success) {
                    currentCriteria = critData.criteria;
                    const select = document.getElementById('criteriaSelector');
                    select.innerHTML = '<option value="">Choose scoring criteria</option>' + 
                        critData.criteria.map(c => 
                            `<option value="${c.criteria_id}" data-weight="${c.weight}" data-max="${c.max_score}">${c.criteria_name} (Weight: ${c.weight})</option>`
                        ).join('');
                }
            } catch (error) {
                console.error('Error loading event data:', error);
            }
        }
        
        document.getElementById('criteriaSelector').addEventListener('change', (e) => {
            const selected = e.target.selectedOptions[0];
            if (selected && selected.value) {
                const weight = selected.dataset.weight;
                const maxScore = selected.dataset.max;
                document.getElementById('criteriaInfo').innerHTML = `Weight: ${weight} | Max Score: ${maxScore}`;
                document.getElementById('scoreHint').textContent = `Maximum score: ${maxScore}`;
                document.getElementById('scoreValue').max = maxScore;
            }
        });
        
        document.getElementById('scoreForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const participantValue = document.getElementById('participantSelector').value;
            const criteriaId = document.getElementById('criteriaSelector').value;
            const scoreValue = document.getElementById('scoreValue').value;
            const remarks = document.getElementById('scoreRemarks').value;
            
            if (!participantValue || !criteriaId) {
                showNotification('Please select participant and criteria', 'error');
                return;
            }
            
            const [type, id] = participantValue.split(':');
            const scoreData = {
                event_id: currentEvent,
                criteria_id: parseInt(criteriaId),
                score_value: parseFloat(scoreValue),
                remarks: remarks
            };
            
            if (type === 'team') {
                scoreData.team_id = parseInt(id);
            } else {
                scoreData.participant_id = parseInt(id);
            }
            
            const success = await submitScore(scoreData);
            if (success) {
                document.getElementById('scoreForm').reset();
                document.getElementById('criteriaInfo').innerHTML = '';
            }
        });
        
        loadComponent('sidebar-container', '/components/sidebar.html');
        loadComponent('navbar-container', '/components/navbar.html');
        loadComponent('footer-container', '/components/footer.html');
        initScoring();
    </script>
</body>
</html>
