<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - EvenTrix</title>
    <link href="/assets/css/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .main-content { margin-left: 256px; }
    </style>
</head>
<body class="bg-soft">
    <div id="sidebar-container"></div>
    
    <div class="main-content min-h-screen">
        <div id="navbar-container"></div>
        
        <main class="p-8">
            <div class="mb-8">
                <h2 class="text-3xl font-bold text-primary" data-testid="schedule-title">Event Schedule</h2>
                <p class="text-gray-600 mt-2">View and manage event timelines</p>
            </div>
            
            <div class="card">
                <h3 class="text-2xl font-bold text-primary mb-6" data-testid="schedule-calendar-heading">Upcoming Events</h3>
                <div id="scheduleList" class="space-y-4" data-testid="schedule-list">
                    <p class="text-gray-500">Loading schedule...</p>
                </div>
            </div>
        </main>
        
        <div id="footer-container"></div>
    </div>
    
    <script src="/assets/js/main.js"></script>
    <script>
        async function loadComponent(elementId, componentPath) {
            const response = await fetch(componentPath);
            const html = await response.text();
            document.getElementById(elementId).innerHTML = html;
        }
        
        async function initSchedule() {
            const user = await checkAuth();
            if (!user) {
                window.location.href = '/login.html';
                return;
            }
            loadSchedule();
        }
        
        async function loadSchedule() {
            try {
                const response = await fetch('/api/get_events.php');
                const data = await response.json();
                
                if (data.success) {
                    displaySchedule(data.events);
                }
            } catch (error) {
                console.error('Error loading schedule:', error);
            }
        }
        
        function displaySchedule(events) {
            const container = document.getElementById('scheduleList');
            if (events.length === 0) {
                container.innerHTML = '<p class="text-gray-500">No events scheduled</p>';
                return;
            }
            
            container.innerHTML = events.map(event => `
                <div class="border-l-4 border-accent pl-6 py-4 bg-white rounded-r-lg shadow-sm" data-testid="schedule-item-${event.event_id}">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="text-xl font-bold text-primary">${event.event_name}</h4>
                            <p class="text-gray-600 mt-1">${event.description || 'No description'}</p>
                        </div>
                        <span class="px-4 py-2 rounded-full text-sm font-semibold ${
                            event.status === 'ongoing' ? 'bg-green-100 text-green-700' : 
                            event.status === 'upcoming' ? 'bg-blue-100 text-blue-700' : 
                            'bg-gray-100 text-gray-700'
                        }">${event.status}</span>
                    </div>
                    <div class="mt-4 grid md:grid-cols-2 gap-4 text-sm text-gray-600">
                        <div><strong>📅 Start:</strong> ${formatDate(event.start_date)}</div>
                        <div><strong>🏁 End:</strong> ${formatDate(event.end_date)}</div>
                    </div>
                </div>
            `).join('');
        }
        
        loadComponent('sidebar-container', '/components/sidebar.html');
        loadComponent('navbar-container', '/components/navbar.html');
        loadComponent('footer-container', '/components/footer.html');
        initSchedule();
    </script>
</body>
</html>
