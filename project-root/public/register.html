<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EvenTrix</title>
    <link href="/assets/css/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-soft min-h-screen flex items-center justify-center py-12">
    <div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <img src="https://images.unsplash.com/photo-1721441906254-b5d28d9114f4?crop=entropy&cs=srgb&fm=jpg&w=150&q=85" alt="MINSU Logo" class="h-16 w-16 rounded-full mx-auto mb-4 object-cover">
            <h1 class="text-3xl font-bold text-primary" data-testid="register-title">Create Account</h1>
            <p class="text-gray-600 mt-2">Join EvenTrix event management system</p>
        </div>

        <form id="registerForm" data-testid="register-form">
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2" for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" class="input-field" placeholder="John" required data-testid="register-firstname-input">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2" for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" class="input-field" placeholder="Doe" required data-testid="register-lastname-input">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2" for="email">Email</label>
                <input type="email" id="email" name="email" class="input-field" placeholder="your@email.com" required data-testid="register-email-input">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2" for="password">Password</label>
                <input type="password" id="password" name="password" class="input-field" placeholder="Create a password" required data-testid="register-password-input">
            </div>

            <div id="errorMessage" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg" data-testid="register-error-message"></div>
            <div id="successMessage" class="hidden mb-4 p-3 bg-green-100 text-green-700 rounded-lg" data-testid="register-success-message"></div>

            <button type="submit" class="btn-primary w-full" data-testid="register-submit-btn">Register</button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-600">Already have an account? <a href="/login.html" class="text-accent font-semibold hover:underline" data-testid="login-link">Login here</a></p>
            <p class="text-sm text-gray-500 mt-2"><a href="/index.html" class="hover:text-accent" data-testid="home-link">← Back to Home</a></p>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            
            try {
                const response = await fetch('/api/auth.php?action=register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    successDiv.textContent = 'Registration successful! Redirecting to login...';
                    successDiv.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    errorDiv.textContent = data.error || 'Registration failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'An error occurred. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
