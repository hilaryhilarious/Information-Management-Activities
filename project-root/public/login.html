<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EvenTrix</title>
    <link href="/assets/css/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-soft min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <img src="https://images.unsplash.com/photo-1721441906254-b5d28d9114f4?crop=entropy&cs=srgb&fm=jpg&w=150&q=85" alt="MINSU Logo" class="h-16 w-16 rounded-full mx-auto mb-4 object-cover">
            <h1 class="text-3xl font-bold text-primary" data-testid="login-title">EvenTrix Login</h1>
            <p class="text-gray-600 mt-2">Access your event management dashboard</p>
        </div>

        <form id="loginForm" data-testid="login-form">
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2" for="email">Email</label>
                <input type="email" id="email" name="email" class="input-field" placeholder="your@email.com" required data-testid="login-email-input">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2" for="password">Password</label>
                <input type="password" id="password" name="password" class="input-field" placeholder="Enter your password" required data-testid="login-password-input">
            </div>

            <div id="errorMessage" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg" data-testid="login-error-message"></div>

            <button type="submit" class="btn-primary w-full" data-testid="login-submit-btn">Login</button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-600">Don't have an account? <a href="/register.html" class="text-accent font-semibold hover:underline" data-testid="register-link">Register here</a></p>
            <p class="text-sm text-gray-500 mt-2"><a href="/index.html" class="hover:text-accent" data-testid="home-link">← Back to Home</a></p>
        </div>

        <div class="mt-6 p-4 bg-soft rounded-lg text-sm">
            <p class="font-semibold text-primary mb-2">Demo Credentials:</p>
            <p class="text-gray-600">Email: admin@eventrix.com</p>
            <p class="text-gray-600">Password: password</p>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            try {
                const response = await fetch('/api/auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/pages/dashboard.html';
                } else {
                    errorDiv.textContent = data.error || 'Login failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'An error occurred. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
